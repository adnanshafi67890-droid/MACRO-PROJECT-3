<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>REALTIME CHAT ENGINE - DEEP SPACE MIDNIGHT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-black: #0b0f19;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(99, 102, 241, 0.35);
            --glass-glow: rgba(99, 102, 241, 0.2);
            --accent-blue: #6366f1;         /* Electric Indigo */
            --accent-blue-bright: #38bdf8;  /* Sky Blue */
            --accent-blue-deep: #4338ca;    /* Deep Indigo */
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-black);
            color: var(--text-main);
        }

        /* Deep Space Midnight Background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            background: linear-gradient(rgba(11, 15, 25, 0.82), rgba(11, 15, 25, 0.82)),
                        url("/static/main_bg.jpg") no-repeat center center / cover;
            background-color: var(--bg-black);
        }

        /* Glassmorphism Card Styling */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.85),
                inset 0 1.5px 1.5px rgba(255, 255, 255, 0.15),
                0 0 35px var(--glass-glow);
            border-radius: 20px;
        }

        /* Auth Screen */
        #login-screen {
            padding: 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }

        #login-screen h2 {
            font-size: 24px;
            margin-bottom: 6px;
            color: var(--accent-blue-bright);
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            font-weight: 800;
        }

        #login-screen p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .status-badge {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: inline-block;
            font-weight: 500;
        }
        .status-connecting { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
        .status-connected { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        input, select, button {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(11, 15, 25, 0.7);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue-bright);
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
        }

        button {
            background: linear-gradient(135deg, var(--accent-blue-deep), var(--accent-blue));
            color: #ffffff;
            font-weight: 800;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.6);
        }

        button:disabled {
            background: rgba(51, 65, 85, 0.5);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            box-shadow: none;
        }

        .toggle-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            color: var(--text-main);
            border-color: var(--accent-blue-bright);
        }

        .error-text { color: #f87171; font-size: 13px; margin-bottom: 12px; display: none; }
        .success-text { color: #4ade80; font-size: 13px; margin-bottom: 12px; display: none; }

        /* Workspace Container */
        #app-screen {
            display: none;
            width: 100%;
            max-width: 1000px;
            height: 90dvh;
            max-height: 900px;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(11, 15, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar h3 {
            font-size: 13px;
            color: var(--accent-blue-bright);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
        }

        .user-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .user-item {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #22c55e;
        }

        /* Chat Workspace */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        .chat-header {
            padding: 12px 20px;
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .profile-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .profile-trigger:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--accent-blue-bright);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .profile-trigger-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-blue-bright);
        }

        .profile-trigger-name {
            font-weight: 700;
            font-size: 13.5px;
            color: var(--accent-blue-bright);
        }

        .header-title-text {
            font-size: 13px;
            color: var(--accent-blue-bright);
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .messages-box {
            flex-grow: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            background: rgba(11, 15, 25, 0.75);
        }

        /* Message Bubbles */
        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-me {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(67, 56, 202, 0.85), rgba(99, 102, 241, 0.75));
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .msg-other {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .msg-direct {
            background: rgba(88, 28, 135, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.5);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg-ai {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
            border: 1px solid var(--accent-blue-bright);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }

        .msg-system {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-muted);
            font-size: 11.5px;
            align-self: center;
            text-align: center;
            border: 1px dashed var(--glass-border);
            padding: 4px 14px;
            border-radius: 20px;
            max-width: 90%;
        }

        .msg-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .msg-author {
            font-weight: 700;
            font-size: 11.5px;
            color: var(--accent-blue-bright);
        }

        .msg-me .msg-author { color: #e0f2fe; }

        .reply-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            padding: 0 4px;
            box-shadow: none;
            width: auto;
            margin-bottom: 0;
            opacity: 0.75;
            transition: opacity 0.2s;
        }

        .reply-btn:hover {
            opacity: 1;
            color: #ffffff;
            transform: none;
        }

        .msg-quoted-box {
            background: rgba(11, 15, 25, 0.6);
            border-left: 3.5px solid var(--accent-blue-bright);
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .msg-me .msg-quoted-box {
            background: rgba(0, 0, 0, 0.3);
            border-left-color: #ffffff;
        }

        .msg-quoted-author {
            font-weight: 700;
            font-size: 11px;
            color: var(--accent-blue-bright);
            margin-bottom: 2px;
        }

        .msg-me .msg-quoted-author { color: #bae6fd; }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .msg-timestamp {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
        }

        .reply-preview-bar {
            display: none;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--glass-border);
            border-left: 4px solid var(--accent-blue-bright);
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            font-size: 12.5px;
            color: var(--accent-blue-bright);
        }

        .reply-preview-bar button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: auto;
            padding: 0;
            margin-bottom: 0;
            font-size: 16px;
            box-shadow: none;
        }

        .typing-bar {
            height: 20px;
            padding: 0 20px;
            font-size: 11.5px;
            color: var(--accent-blue-bright);
            font-style: italic;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            background: rgba(11, 15, 25, 0.5);
        }

        .input-bar {
            padding: 12px 16px;
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-bar select { width: 160px; margin-bottom: 0; }
        .input-bar input { flex-grow: 1; margin-bottom: 0; }
        .input-bar button { width: 90px; margin-bottom: 0; }

        /* Profile Modal Window */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            width: 90%;
            max-width: 340px;
            padding: 28px 20px;
            text-align: center;
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            width: auto;
            box-shadow: none;
        }

        .modal-avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 14px auto;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid var(--accent-blue-bright);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        .modal-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-blue-bright);
            font-size: 11px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-avatar-wrapper:hover .modal-avatar-overlay { opacity: 1; }

        .modal-username { font-size: 18px; color: var(--text-main); margin-bottom: 4px; font-weight: 800; }
        .modal-status-text { font-size: 12px; color: var(--accent-blue-bright); margin-bottom: 20px; }

        .modal-actions { display: flex; flex-direction: column; gap: 8px; }

        .btn-logout {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue-bright);
            box-shadow: none;
        }

        .btn-delete {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            box-shadow: none;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 4px; }

        /* Mobile Viewport */
        @media (max-width: 680px) {
            body { padding: 0; }
            #app-screen {
                height: 100dvh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
            .app-container { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: 95px;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 10px;
            }
            .sidebar h3 { font-size: 11px; margin-bottom: 6px; }
            .user-item { padding: 4px 8px; font-size: 12px; }
            .input-bar { padding: 10px; }
            .input-bar select { width: 110px; font-size: 12px; padding: 10px 8px; }
            .input-bar button { width: 70px; font-size: 13px; }
            .msg { max-width: 88%; }
        }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="login-screen" class="glass-card">
        <h2 id="auth-title">Account Login</h2>
        <p id="auth-sub">Enter your credentials to connect</p>
        <div id="connection-status" class="status-badge status-connecting">Connecting...</div>
        
        <div id="auth-error" class="error-text"></div>
        <div id="auth-success" class="success-text"></div>

        <input type="text" id="username-input" placeholder="Username" maxlength="20">
        <input type="password" id="password-input" placeholder="Password" maxlength="30">
        
        <button id="auth-submit-btn" onclick="submitAuth()" disabled>Login</button>
        <button class="toggle-btn" id="toggle-auth-btn" onclick="toggleAuthMode()">Need an account? Register</button>
    </div>

    <!-- Main App Workspace -->
    <div id="app-screen" class="glass-card">
        <div class="app-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <h3>Active Users (<span id="user-count">0</span>)</h3>
                <ul id="user-list" class="user-list"></ul>
            </div>

            <!-- Chat Workspace -->
            <div class="chat-area">
                <div class="chat-header">
                    <div class="profile-trigger" onclick="openProfileModal()">
                        <img id="header-avatar-img" src="" alt="Avatar" class="profile-trigger-avatar">
                        <span id="header-username-display" class="profile-trigger-name">User</span>
                    </div>
                    <div class="header-title-text">REALTIME CHAT ENGINE</div>
                </div>
                
                <div id="messages-box" class="messages-box"></div>
                
                <div id="typing-bar" class="typing-bar"></div>

                <!-- Reply Preview Banner -->
                <div id="reply-preview-bar" class="reply-preview-bar">
                    <span id="reply-preview-text">Replying...</span>
                    <button onclick="cancelReply()">✕</button>
                </div>
                
                <div class="input-bar">
                    <select id="recipient-select">
                        <option value="ALL">Everyone (Public)</option>
                    </select>
                    <input type="text" id="message-input" placeholder="Type a message or @ai to ask AI..." oninput="handleTypingInput()" onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal-overlay" onclick="closeProfileModal(event)">
        <div class="modal-card glass-card" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeProfileModal()">&times;</button>

            <div class="modal-avatar-wrapper" onclick="triggerAvatarUpload()">
                <img id="modal-avatar-img" src="" alt="Profile Picture" class="modal-avatar-img">
                <div class="modal-avatar-overlay">📷 Change</div>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="handleAvatarSelected(event)">

            <h3 id="modal-username-display" class="modal-username">User</h3>
            <p class="modal-status-text">🟢 Active Now</p>

            <div class="modal-actions">
                <button class="modal-btn btn-logout" onclick="logoutAccount()">🚪 Logout</button>
                <button class="modal-btn btn-delete" onclick="deleteAccount()">🗑️ Delete Account</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ transports: ['polling', 'websocket'], upgrade: true });

        const DEFAULT_AVATAR = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2338bdf8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.68 3.37-2.6 5.05-2.6s5.02.92 5.05 2.6C15.8 19.15 14.03 20 12 20z"/></svg>`;

        let currentUser = "";
        let currentAvatar = DEFAULT_AVATAR;
        let isRegisterMode = false;
        let replyingTo = null;
        let typingTimeout = null;

        const statusBadge = document.getElementById("connection-status");
        const submitBtn = document.getElementById("auth-submit-btn");
        const errorDiv = document.getElementById("auth-error");
        const successDiv = document.getElementById("auth-success");

        socket.on("connect", () => {
            statusBadge.innerText = "Connected to Server";
            statusBadge.className = "status-badge status-connected";
            submitBtn.disabled = false;
        });

        socket.on("connect_error", (err) => {
            statusBadge.innerText = "Connection Failed: " + err.message;
            statusBadge.className = "status-badge status-error";
        });

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            if (isRegisterMode) {
                document.getElementById("auth-title").innerText = "Create Account";
                document.getElementById("auth-sub").innerText = "Choose a username and password";
                submitBtn.innerText = "Register Account";
                document.getElementById("toggle-auth-btn").innerText = "Already have an account? Login";
            } else {
                document.getElementById("auth-title").innerText = "Account Login";
                document.getElementById("auth-sub").innerText = "Enter your credentials to connect";
                submitBtn.innerText = "Login";
                document.getElementById("toggle-auth-btn").innerText = "Need an account? Register";
            }
        }

        function submitAuth() {
            const username = document.getElementById("username-input").value.trim();
            const password = document.getElementById("password-input").value.trim();

            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            if (!username || !password) {
                errorDiv.innerText = "Please enter both username and password.";
                errorDiv.style.display = "block";
                return;
            }

            if (isRegisterMode) {
                socket.emit("register_account", { username: username, password: password });
            } else {
                socket.emit("login_account", { username: username, password: password });
            }
        }

        socket.on("auth_response", (data) => {
            if (data.success) {
                if (data.action === "register") {
                    successDiv.innerText = data.message;
                    successDiv.style.display = "block";
                    toggleAuthMode();
                } else if (data.action === "login") {
                    currentUser = data.username;
                    currentAvatar = data.profile_pic || DEFAULT_AVATAR;
                    updateProfileDisplays();

                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("app-screen").style.display = "block";
                }
            } else {
                errorDiv.innerText = data.message;
                errorDiv.style.display = "block";
            }
        });

        function updateProfileDisplays() {
            document.getElementById("header-username-display").innerText = currentUser;
            document.getElementById("modal-username-display").innerText = currentUser;
            document.getElementById("header-avatar-img").src = currentAvatar;
            document.getElementById("modal-avatar-img").src = currentAvatar;
        }

        /* Profile Modal Controls */
        function openProfileModal() { document.getElementById("profile-modal").style.display = "flex"; }
        function closeProfileModal(e) {
            if (!e || e.target.id === "profile-modal" || e.target.classList.contains("modal-close-btn")) {
                document.getElementById("profile-modal").style.display = "none";
            }
        }

        function triggerAvatarUpload() { document.getElementById("avatar-file-input").click(); }
        function handleAvatarSelected(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                socket.emit("update_profile_pic", { image: evt.target.result });
            };
            reader.readAsDataURL(file);
        }

        socket.on("profile_pic_updated", (data) => {
            if (data.success) {
                currentAvatar = data.image;
                updateProfileDisplays();
            }
        });

        /* Logout & Account Deletion */
        function logoutAccount() { socket.emit("logout_account"); }

        socket.on("logout_response", () => {
            closeProfileModal();
            currentUser = "";
            currentAvatar = DEFAULT_AVATAR;
            document.getElementById("messages-box").innerHTML = "";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
            socket.disconnect();
            socket.connect();
        });

        function deleteAccount() {
            if (confirm("Permanently delete your account?")) {
                socket.emit("delete_account");
            }
        }

        socket.on("account_deleted", (data) => {
            if (data.success) {
                alert(data.message);
                window.location.reload();
            }
        });

        /* Typing Indicator */
        function handleTypingInput() {
            const recipient = document.getElementById("recipient-select").value;
            socket.emit("typing", { is_typing: true, recipient: recipient });

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit("typing", { is_typing: false, recipient: recipient });
            }, 1800);
        }

        socket.on("user_typing", (data) => {
            const typingBar = document.getElementById("typing-bar");
            if (data.is_typing) {
                typingBar.innerText = `${data.username} is typing...`;
            } else {
                typingBar.innerText = "";
            }
        });

        /* Reply Mechanism */
        function setReplyTo(sender, content) {
            const displayName = (sender === currentUser) ? "You" : sender;
            replyingTo = { sender: displayName, content: content };
            
            document.getElementById("reply-preview-text").innerText = `Replying to ${displayName}: "${content.substring(0, 32)}${content.length > 32 ? '...' : ''}"`;
            document.getElementById("reply-preview-bar").style.display = "flex";
            document.getElementById("message-input").focus();
        }

        function cancelReply() {
            replyingTo = null;
            document.getElementById("reply-preview-bar").style.display = "none";
        }

        /* Message Sending */
        function sendMessage() {
            const input = document.getElementById("message-input");
            const recipient = document.getElementById("recipient-select").value;
            const content = input.value.trim();

            if (!content) return;

            if (recipient === "ALL") {
                socket.emit("public_message", { content: content, reply_to: replyingTo });
            } else {
                socket.emit("private_message", { recipient: recipient, content: content, reply_to: replyingTo });
            }

            input.value = "";
            cancelReply();
            socket.emit("typing", { is_typing: false, recipient: recipient });
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        /* Message Rendering */
        socket.on("chat_message", (data) => {
            const msgBox = document.getElementById("messages-box");
            const div = document.createElement("div");

            if (data.type === "SYSTEM") {
                div.className = "msg msg-system";
                div.textContent = data.content;
            } else {
                const isMe = (data.sender === currentUser);
                const isAI = (data.type === "AI_BOT");
                
                if (isMe) {
                    div.className = "msg msg-me";
                } else if (isAI) {
                    div.className = "msg msg-ai";
                } else if (data.type === "DIRECT") {
                    div.className = "msg msg-direct";
                } else {
                    div.className = "msg msg-other";
                }

                const headerRow = document.createElement("div");
                headerRow.className = "msg-header-row";

                const authorDiv = document.createElement("span");
                authorDiv.className = "msg-author";
                authorDiv.textContent = isMe ? "You" : (data.type === "DIRECT" ? `🔒 ${data.sender}` : data.sender);

                const replyBtn = document.createElement("button");
                replyBtn.className = "reply-btn";
                replyBtn.textContent = "↩ Reply";
                replyBtn.onclick = () => setReplyTo(data.sender, data.content);

                headerRow.appendChild(authorDiv);
                headerRow.appendChild(replyBtn);
                div.appendChild(headerRow);

                if (data.reply_to) {
                    const quoteBox = document.createElement("div");
                    quoteBox.className = "msg-quoted-box";

                    const quoteAuthor = document.createElement("div");
                    quoteAuthor.className = "msg-quoted-author";
                    quoteAuthor.textContent = data.reply_to.sender;

                    const quoteText = document.createTextNode(data.reply_to.content);
                    quoteBox.appendChild(quoteAuthor);
                    quoteBox.appendChild(quoteText);
                    div.appendChild(quoteBox);
                }

                const contentDiv = document.createElement("div");
                contentDiv.textContent = data.content;
                div.appendChild(contentDiv);

                const footerDiv = document.createElement("div");
                footerDiv.className = "msg-footer";

                const timeSpan = document.createElement("span");
                timeSpan.className = "msg-timestamp";
                timeSpan.textContent = data.timestamp;
                footerDiv.appendChild(timeSpan);

                div.appendChild(footerDiv);
            }

            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        });

        /* Active User List & Recipient Sync */
        socket.on("update_user_list", (data) => {
            const userListEl = document.getElementById("user-list");
            const countEl = document.getElementById("user-count");
            const recipientSelect = document.getElementById("recipient-select");

            const currentSelected = recipientSelect.value;
            userListEl.innerHTML = "";
            
            // Keep "Everyone (Public)" option
            recipientSelect.innerHTML = `<option value="ALL">Everyone (Public)</option>`;

            const filteredUsers = data.users.filter(u => u !== currentUser);
            countEl.innerText = data.users.length;

            filteredUsers.forEach(username => {
                // Render sidebar element
                const li = document.createElement("li");
                li.className = "user-item";
                li.innerHTML = `<span class="status-dot"></span>${username}`;
                userListEl.appendChild(li);

                // Populate DM recipient dropdown
                const opt = document.createElement("option");
                opt.value = username;
                opt.innerText = `🔒 DM ${username}`;
                if (username === currentSelected) opt.selected = true;
                recipientSelect.appendChild(opt);
            });
        });
    </script>
</body>
</html>
